services:
  db:
    image: postgres:15-alpine
    container_name: aps-db
    environment:
      POSTGRES_DB: ${APS_DB_NAME:-aps_db}
      POSTGRES_USER: ${APS_DB_USER:-aps_user}
      POSTGRES_PASSWORD: ${APS_DB_PASSWORD:-aps12345}
      TZ: ${APS_TIMEZONE:-Asia/Seoul}
      PGTZ: ${APS_TIMEZONE:-Asia/Seoul}
    ports:
      - "${APS_DB_PORT:-5433}:5432"
    volumes:
      - aps-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APS_DB_USER:-aps_user} -d ${APS_DB_NAME:-aps_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - aps

  backend:
    build:
      context: ./aps-backend
      dockerfile: Dockerfile
    container_name: aps-backend
    env_file:
      - .env
    environment:
      # In-container override — reach postgres via the compose network hostname.
      APS_DB_URL: postgresql://${APS_DB_USER:-aps_user}:${APS_DB_PASSWORD:-aps12345}@db:5432/${APS_DB_NAME:-aps_db}
    ports:
      # Loopback only — public traffic arrives through the nginx service.
      - "127.0.0.1:${APS_API_PORT:-8002}:8000"
    volumes:
      - ./aps-backend:/app
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Single worker: the G-System cron scheduler must not run duplicated per worker.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - aps

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: aps-nginx:latest
    container_name: aps-nginx
    ports:
      # Public entrypoint for aps-be.gsystem.ai (gateway 192.168.205.231 forwards here).
      - "${APS_PROXY_PORT:-8001}:8001"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - aps

  frontend:
    build:
      context: ./aps-frontend
      dockerfile: Dockerfile
    container_name: aps-frontend
    environment:
      # Explicit, not env_file — the frontend container has no business holding
      # G-System / DB credentials. The browser calls the API cross-origin, so this
      # must be the API's public URL, never localhost.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://aps-be.gsystem.ai/api/v1}
    ports:
      # Public entrypoint for aps-fe.gsystem.ai — the gateway proxies straight to Vite.
      - "${APS_FE_PORT:-5175}:5173"
    volumes:
      - ./aps-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aps

networks:
  aps:
    driver: bridge

volumes:
  aps-db-data:
